---
- name: Deploy the Inventory Manager through Azure Bastion
  hosts: inventory
  become: true
  gather_facts: true

  vars:
    desired_image: "{{ container_registry_login_server }}/inventory-manager:{{ container_image_tag }}"

  pre_tasks:
    - name: Validate deployment variables
      ansible.builtin.assert:
        that:
          - container_registry_name | default("") | length > 0
          - container_registry_login_server | default("") | length > 0
          - container_image_tag | default("") | length > 0
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version("24.04", ">=")

  tasks:
    - name: Install Docker and Docker Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Docker is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Ensure SSH is enabled and running
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: true

    - name: Authenticate Azure CLI with the VM managed identity
      ansible.builtin.command:
        argv:
          - az
          - login
          - --identity
          - --allow-no-subscriptions
      changed_when: false

    - name: Authenticate Docker with ACR
      ansible.builtin.command:
        argv:
          - az
          - acr
          - login
          - --name
          - "{{ container_registry_name }}"
      changed_when: false

    - name: Store the desired container image tag
      ansible.builtin.copy:
        dest: /etc/inventory-manager.env
        owner: root
        group: root
        mode: "0600"
        content: |
          CONTAINER_REGISTRY_LOGIN_SERVER={{ container_registry_login_server }}
          CONTAINER_IMAGE_TAG={{ container_image_tag }}
          CONTAINER_REGISTRY_NAME={{ container_registry_name }}
      register: deployment_environment

    - name: Pull the desired container image
      ansible.builtin.command:
        argv:
          - docker
          - pull
          - "{{ desired_image }}"
      changed_when: false

    - name: Inspect the desired container image ID
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - --format
          - "{{ '{{' }}.Id{{ '}}' }}"
          - "{{ desired_image }}"
      register: desired_image_id
      changed_when: false

    - name: Inspect the currently running container image ID
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.Image{{ '}}' }}"
          - inventory-manager
      register: running_image_id
      changed_when: false
      failed_when: false

    - name: Fail when Docker container inspection reports an unexpected error
      ansible.builtin.fail:
        msg: >-
          Docker failed to inspect inventory-manager unexpectedly:
          {{ running_image_id.stderr | default(running_image_id.msg | default('unknown Docker error'), true) }}
      when:
        - running_image_id.rc != 0
        - "'no such container' not in (running_image_id.stderr | default('') | lower)"
        - "'no such object' not in (running_image_id.stderr | default('') | lower)"

    - name: Check whether the inventory-manager systemd service is active
      ansible.builtin.command:
        argv:
          - /bin/systemctl
          - is-active
          - inventory-manager
      register: inventory_service_status
      changed_when: false
      failed_when: false

    - name: Restart the managed systemd application when its image or environment changes
      ansible.builtin.systemd:
        name: inventory-manager
        state: restarted
        daemon_reload: true
        enabled: true
      when:
        - >-
          inventory_service_status.rc != 0 or
          deployment_environment.changed or
          running_image_id.rc != 0 or
          running_image_id.stdout != desired_image_id.stdout

    - name: Wait for the application health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/health
        method: GET
        status_code: 200
        return_content: true
      register: application_health
      retries: 12
      delay: 5
      until:
        - application_health.status == 200
        - application_health.json.status == "ok"

    - name: Inspect the running container image after health verification
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - "{{ '{{' }}.Image{{ '}}' }}"
          - inventory-manager
      register: deployed_image_id
      changed_when: false

    - name: Verify that the requested image is running
      ansible.builtin.assert:
        that:
          - deployed_image_id.stdout == desired_image_id.stdout
        fail_msg: >-
          The application is healthy but is not running the requested image.
          Ensure /usr/local/sbin/start-inventory-manager reads
          /etc/inventory-manager.env before retrying deployment.

    - name: Install SSH hardening drop-in with public-key authentication preserved
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/60-ansible-hardening.conf
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
        content: |
          PubkeyAuthentication yes
          PermitRootLogin no
          MaxAuthTries 4
          X11Forwarding no
      notify: Reload SSH

    - name: Validate the complete SSH server configuration before reload
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false

  handlers:
    - name: Reload SSH
      ansible.builtin.service:
        name: ssh
        state: reloaded
