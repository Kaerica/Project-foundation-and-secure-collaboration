name: CI Pipeline

permissions:
  contents: read

on:
  workflow_call:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  ansible-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install --disable-pip-version-check ansible-core

      - name: Check Ansible playbook syntax
        run: |
          export ANSIBLE_CONFIG="$PWD/ansible/ansible.cfg"
          ansible-playbook -i ansible/inventory.ini --syntax-check ansible/playbook.yml

  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependency scan (npm audit)
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: inventory_app
      PGPASSWORD: local-development-only
      PGDATABASE: inventory_manager
      PGSSL: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventory_app
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: inventory_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory_app -d inventory_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: PostgreSQL integration test
        run: npm run test:database

      - name: Build Docker image
        run: docker build -t "inventory-manager:${GITHUB_SHA}" .

      - name: Container scan (Trivy) - report
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" \
            aquasec/trivy:0.58.1 image \
            --format json \
            --output /workspace/trivy-report.json \
            "inventory-manager:${GITHUB_SHA}"

      - name: Container scan (Trivy) - enforce
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            "inventory-manager:${GITHUB_SHA}"

      - name: Save scanned image
        run: docker save "inventory-manager:${GITHUB_SHA}" --output inventory-manager-image.tar

      - name: Upload scanned image
        uses: actions/upload-artifact@v4
        with:
          name: inventory-manager-image
          path: inventory-manager-image.tar
          retention-days: 1

      - name: Upload full Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn

  iac-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: IaC scan (Checkov)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            bridgecrew/checkov:3.2.500 \
            --directory . \
            --framework terraform dockerfile github_actions \
            --skip-check CKV_AZURE_136,CKV_AZURE_166,CKV_AZURE_165,CKV_AZURE_167,CKV_AZURE_237,CKV_AZURE_233,CKV_AZURE_164,CKV2_AZURE_57 \
            --compact
